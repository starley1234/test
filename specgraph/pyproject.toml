[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specgraph"
version = "0.1.0"
description = "Modular monolith: Word specs → product/requirement graph → LLM pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "tika>=2.6",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "sentence-transformers>=3.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["specgraph*"]
