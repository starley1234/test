<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpecGraph</title>
  <style>
    :root {
      --bg: #0e1218; --panel: #161c24; --line: #2a3442;
      --text: #e8eef4; --muted: #8b9aab; --acc: #3d9cf0;
      --ok: #3ecf8e; --warn: #e6b84d; --bad: #e06c75;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    header .sub { color: var(--muted); font-size: 13px; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; }
    nav a.on, nav a:hover { background: #1f2833; color: var(--text); }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, .btn { background: var(--acc); color: #041018; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: transparent; color: var(--bad); border: 1px solid #5a2a30; }
    .layout { display: grid; grid-template-columns: 340px 1fr 360px; height: calc(100vh - 58px); }
    .page { display: none; min-height: calc(100vh - 58px); }
    .page.on { display: block; }
    .page.browse { padding: 20px 24px 40px; max-width: 980px; }
    .col { overflow: auto; border-right: 1px solid var(--line); padding: 16px; }
    .col:last-child { border-right: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 8px; }
    h2:first-child { margin-top: 0; }
    h3 { font-size: 20px; margin: 0 0 6px; }
    .crumbs { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .crumbs a { color: var(--acc); text-decoration: none; }
    .drop {
      border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px 14px;
      text-align: center; color: var(--muted); background: #12181f; cursor: pointer;
    }
    .drop.over { border-color: var(--acc); color: var(--acc); background: #132033; }
    .drop b { color: var(--text); display: block; margin-bottom: 4px; }
    .queue { margin-top: 10px; }
    .qfile { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; background: #12181f; margin-bottom: 4px; font-size: 12px; }
    .qfile .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #243041; color: var(--muted); }
    .tag.spec { background: #14304a; color: #8ec8ff; }
    .tag.attachment { background: #3a2e14; color: var(--warn); }
    .tag.stub { background: #3a2e14; color: var(--warn); }
    .tag.ok { background: #143326; color: var(--ok); }
    .tag.err { background: #3a1418; color: var(--bad); }
    .tag.run { background: #2a2540; color: #c4b5fd; }
    .stat { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat div { background: #12181f; padding: 8px 10px; border-radius: 8px; min-width: 68px; }
    .stat b { display: block; font-size: 18px; }
    .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; animation: pop .25s ease; }
    .item:hover, .item.on { background: #1f2833; }
    .item.new { outline: 1px solid #3d9cf055; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .card a { color: var(--acc); text-decoration: none; }
    .code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--acc); }
    .feed { font-size: 12px; }
    .feed .ev { padding: 6px 0; border-bottom: 1px solid #1e2630; color: var(--muted); }
    .feed .ev b { color: var(--text); }
    .progress { height: 6px; background: #1e2630; border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .progress > i { display: block; height: 100%; background: var(--acc); width: 0; transition: width .2s; }
    pre { white-space: pre-wrap; background: #12181f; padding: 10px; border-radius: 8px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td, th { border-bottom: 1px solid var(--line); padding: 6px 4px; vertical-align: top; text-align: left; }
    .muted { color: var(--muted); }
    .rel { font-size: 12px; color: var(--muted); margin: 4px 0; }
    input[type=search], select { width: 100%; background: #12181f; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .chk { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid #1e2630; }
    .tok { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
    .tok div { background: #12181f; padding: 10px 12px; border-radius: 8px; }
    .tok b { font-size: 20px; display: block; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>SpecGraph</h1>
      <div class="sub">индексация спецификаций и просмотр графа</div>
    </div>
    <nav>
      <a href="#/" id="nav-index">Индекс</a>
      <a href="#/products" id="nav-products">Изделия</a>
      <a href="#/documents" id="nav-documents">Документы</a>
      <a href="#/pipelines" id="nav-pipelines">Пайплайны</a>
    </nav>
    <div class="bar">
      <button class="danger" id="wipeBtn">Очистить БД</button>
    </div>
  </header>

  <div class="page" id="page-index">
    <div class="layout">
      <div class="col">
        <h2>Файлы в пакет</h2>
        <div class="drop" id="drop">
          <b>Перетащите сюда Word / Excel / JSON</b>
          спецификация и вложения к требованиям
          <div style="margin-top:10px"><input id="files" type="file" multiple /></div>
        </div>
        <div class="queue" id="queue"></div>
        <div style="margin:12px 0; display:flex; gap:8px">
          <button id="indexBtn">Индексировать</button>
          <button class="ghost" id="clearBtn">Очистить список</button>
        </div>
        <div class="progress"><i id="bar"></i></div>
        <div class="muted" id="msg">ожидание файлов</div>
        <h2>Ход индексации</h2>
        <div class="feed" id="feed"></div>
      </div>
      <div class="col">
        <h2>База</h2>
        <div class="stat" id="stats"></div>
        <h2>Появившиеся сущности</h2>
        <input type="search" id="q" placeholder="фильтр по коду или тексту…" />
        <div id="reqs" style="margin-top:10px"></div>
      </div>
      <div class="col">
        <h2>Карточка</h2>
        <div id="card" class="muted">Выберите требование</div>
        <h2>Документы</h2>
        <div id="docs"></div>
      </div>
    </div>
  </div>

  <div class="page browse" id="page-browse"></div>

<script>
const $ = (id) => document.getElementById(id);
let bag = [];
let docs = [], reqs = [], currentDoc = null, seen = new Set();

function esc(s){return String(s||'').replace(/[&<>]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));}
async function j(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function parseHash() {
  const h = (location.hash || '#/').replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  return { parts, raw: h };
}

function setNav() {
  const p = parseHash().parts[0] || '';
  ['index','products','documents','pipelines'].forEach(k => {
    const el = $('nav-'+k);
    if (el) el.classList.toggle('on', (k==='index' && !p) || p === k);
  });
}

async function route() {
  setNav();
  const { parts } = parseHash();
  const a = parts[0];
  if (!a) {
    $('page-index').classList.add('on');
    $('page-browse').classList.remove('on');
    return;
  }
  $('page-index').classList.remove('on');
  $('page-browse').classList.add('on');
  const box = $('page-browse');
  box.innerHTML = '<div class="muted">загрузка…</div>';
  try {
    if (a === 'products' && parts[1] && parts[2] === 'docs') {
      await renderProductDocs(box, +parts[1]);
    } else if (a === 'products' && parts[1]) {
      await renderProduct(box, +parts[1]);
    } else if (a === 'products') {
      await renderProducts(box);
    } else if (a === 'documents' && parts[1] && parts[2] === 'requirements') {
      await renderDocReqs(box, +parts[1]);
    } else if (a === 'documents' && parts[1]) {
      await renderDocument(box, +parts[1]);
    } else if (a === 'documents') {
      await renderDocuments(box);
    } else if (a === 'requirements' && parts[1]) {
      await renderReqPage(box, +parts[1]);
    } else {
      box.innerHTML = '<div class="muted">нет такой страницы</div>';
    }
  } catch (e) {
    box.innerHTML = '<div class="muted">'+esc(e.message)+'</div>';
  }
}

async function renderProducts(box) {
  const list = await j('/products');
  box.innerHTML = `
    <div class="crumbs"><a href="#/">Индекс</a> / Изделия</div>
    <h3>Изделия</h3>
    <p class="muted">${list.length} шт.</p>
    ${list.map(p => `
      <div class="card">
        <a class="code" href="#/products/${p.id}">${esc(p.code)}</a>
        <div>${esc(p.name)}</div>
        <div class="muted">уровень ${p.level}${p.parent_id ? ' · parent #'+p.parent_id : ''}</div>
      </div>`).join('') || '<div class="muted">нет изделий — проиндексируйте пакет</div>'}`;
}

async function renderProduct(box, id) {
  const sg = await j('/products/'+id);
  const p = sg.product || {};
  const attrs = Object.entries(p.attributes||{}).map(([k,v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  const anc = (sg.ancestors||[]).slice().reverse().map(a =>
    `<a href="#/products/${a.id}">${esc(a.code)}</a>`).join(' / ');
  const kids = (sg.descendants||[]).map(c =>
    `<div class="item" onclick="location.hash='#/products/${c.id}'"><span class="code">${esc(c.code)}</span> ${esc(c.name)}</div>`).join('');
  const reqsH = (sg.requirements||[]).map(r =>
    `<div class="item" onclick="location.hash='#/requirements/${r.id}'"><span class="code">${esc(r.code)}</span> ${esc((r.text||'').slice(0,140))}</div>`).join('');
  const doc = sg.document;
  box.innerHTML = `
    <div class="crumbs"><a href="#/">Индекс</a> / <a href="#/products">Изделия</a> / ${esc(p.code||'')}</div>
    <h3>${esc(p.name||p.code||'Изделие')}</h3>
    <div class="code">${esc(p.code)}</div>
    ${anc ? '<div class="rel">входит в: '+anc+'</div>' : ''}
    ${doc ? `<div class="rel">документ: <a href="#/documents/${doc.id}">${esc(doc.title||doc.filename)}</a></div>` : ''}
    <p><a href="#/products/${id}/docs">Связанные документы →</a></p>
    ${attrs ? '<h2>Атрибуты</h2><table>'+attrs+'</table>' : ''}
    <h2>Состав</h2>${kids || '<div class="muted">нет дочерних</div>'}
    <h2>Требования</h2>${reqsH || '<div class="muted">нет</div>'}`;
}

async function renderProductDocs(box, id) {
  const data = await j('/products/'+id+'/documents');
  const p = data.product || {};
  box.innerHTML = `
    <div class="crumbs"><a href="#/products">Изделия</a> / <a href="#/products/${id}">${esc(p.code)}</a> / Документы</div>
    <h3>Документы изделия ${esc(p.code)}</h3>
    <p class="muted">${esc(p.name||'')}</p>
    ${(data.documents||[]).map(d => `
      <div class="card">
        <a href="#/documents/${d.id}">${esc(d.title || d.filename)}</a>
        ${d.own ? ' <span class="tag spec">свой</span>' : ''}
        <div class="muted">${esc(d.filename)} · треб. ${d.counts.requirements} · изд. ${d.counts.products}</div>
        <div style="margin-top:6px"><a href="#/documents/${d.id}/requirements">требования документа</a></div>
      </div>`).join('') || '<div class="muted">нет связанных документов</div>'}`;
}

async function renderDocuments(box) {
  const list = await j('/documents');
  box.innerHTML = `
    <div class="crumbs"><a href="#/">Индекс</a> / Документы</div>
    <h3>Документы</h3>
    <p class="muted">${list.length} шт.</p>
    ${list.map(d => `
      <div class="card">
        <a href="#/documents/${d.id}">${esc(d.title || d.filename)}</a>
        <div class="muted">${esc(d.filename)} · ${esc(d.status)} · ${esc(d.kind||'')}</div>
      </div>`).join('') || '<div class="muted">нет документов</div>'}`;
}

async function renderDocument(box, id) {
  const d = await j('/documents/'+id);
  const c = d.counts || {};
  const prods = (d.products||[]).map(p =>
    `<div class="item" onclick="location.hash='#/products/${p.id}'"><span class="code">${esc(p.code)}</span> ${esc(p.name)}</div>`).join('');
  box.innerHTML = `
    <div class="crumbs"><a href="#/documents">Документы</a> / ${esc(d.filename)}</div>
    <h3>${esc(d.title || d.filename)}</h3>
    <div class="muted">${esc(d.filename)} · ${esc(d.status)} · ${esc(d.kind||'')}</div>
    <div class="stat" style="margin:14px 0">
      <div><b>${c.products||0}</b><span class="muted">изделия</span></div>
      <div><b>${c.requirements||0}</b><span class="muted">треб.</span></div>
      <div><b>${c.attachments||0}</b><span class="muted">влож.</span></div>
      <div><b>${c.illustrations||0}</b><span class="muted">рис.</span></div>
    </div>
    <p><a href="#/documents/${id}/requirements">Требования документа →</a></p>
    <h2>Изделия в документе</h2>
    ${prods || '<div class="muted">нет</div>'}`;
}

async function renderDocReqs(box, id) {
  const [d, list] = await Promise.all([j('/documents/'+id), j('/requirements?document_id='+id)]);
  box.innerHTML = `
    <div class="crumbs"><a href="#/documents">Документы</a> / <a href="#/documents/${id}">${esc(d.filename)}</a> / Требования</div>
    <h3>Требования документа</h3>
    <p class="muted">${list.length} шт. · ${esc(d.title || d.filename)}</p>
    ${list.map(r => `
      <div class="card">
        <a class="code" href="#/requirements/${r.id}">${esc(r.code)}</a>
        ${r.revision?'<span class="tag">rev '+esc(r.revision)+'</span>':''}
        ${r.extra&&r.extra.stub?'<span class="tag stub">stub</span>':''}
        <div>${esc((r.text||'').slice(0,280))}</div>
      </div>`).join('') || '<div class="muted">требований нет</div>'}`;
}

async function renderReqPage(box, id) {
  const r = await j('/requirements/'+id);
  const attrs = Object.entries(r.attributes||{}).map(([k,v]) =>
    `<tr><th>${esc(k)}</th><td>${esc(String(v).slice(0,4000))}</td></tr>`).join('');
  const parents = (r.parents||[]).map(p =>
    `<div class="rel">↑ ${p.stub?'<span class="tag stub">не загружено</span>':''}<a class="code" href="#/requirements/${p.id}">${esc(p.code)}</a> ${esc((p.text||'').slice(0,160))}</div>`).join('');
  box.innerHTML = `
    <div class="crumbs">
      ${r.document_id?`<a href="#/documents/${r.document_id}/requirements">Документ</a> / `:''}
      ${esc(r.code)}
    </div>
    <h3 class="code">${esc(r.code)}</h3>
    <div class="muted">${esc(r.kind||'')} · rev ${esc(r.revision||'—')}</div>
    ${r.product_id?`<p><a href="#/products/${r.product_id}">изделие</a></p>`:''}
    <pre>${esc(r.text||'')}</pre>
    <h2>Вышестоящие</h2>${parents || '<div class="muted">нет</div>'}
    <h2>Атрибуты</h2><table>${attrs}</table>`;
}

async function renderPipelines(box) {
  const list = await j('/pipelines');
  box.innerHTML = `
    <div class="crumbs"><a href="#/">Индекс</a> / Пайплайны</div>
    <h3>Пайплайны</h3>
    <p class="muted">индексация — отдельно на главной. Здесь прогоны с ходом и токенами.</p>
    ${list.map(p => `
      <div class="card">
        <a href="#/pipelines/${p.name}">${esc(p.title)}</a>
        <div class="muted">${esc(p.name)} · слот ${esc(p.slot||'—')}</div>
      </div>`).join('')}`;
}

async function renderPipelinePage(box, name) {
  const list = await j('/pipelines');
  const meta = list.find(p => p.name === name) || {title: name, name};
  const docs = await j('/documents');
  const scheme = name === 'schematic-coverage';
  box.innerHTML = `
    <div class="crumbs"><a href="#/pipelines">Пайплайны</a> / ${esc(meta.title)}</div>
    <h3>${esc(meta.title)}</h3>
    <p class="muted">документ → галочки требований → запуск. Токены: чтение = prompt, запись = completion.</p>
    <h2>Документ</h2>
    <select id="pipeDoc">
      <option value="">— выберите —</option>
      ${docs.map(d => `<option value="${d.id}">${esc(d.title || d.filename)}</option>`).join('')}
    </select>
    ${scheme ? `<h2>Файл схемы</h2><input id="pipeFile" type="file" accept="image/*,.pdf" />` : ''}
    <h2>Требования</h2>
    <div class="bar" style="margin-bottom:8px">
      <button class="ghost" type="button" id="pipeAll">все</button>
      <button class="ghost" type="button" id="pipeNone">снять</button>
    </div>
    <div id="pipeReqs" class="muted">сначала документ</div>
    <div style="margin:14px 0"><button id="pipeGo">Запустить</button></div>
    <div class="tok">
      <div><b id="tokP">0</b><span class="muted">чтение (prompt)</span></div>
      <div><b id="tokC">0</b><span class="muted">запись (completion)</span></div>
      <div><b id="tokT">0</b><span class="muted">всего</span></div>
    </div>
    <div class="progress"><i id="pipeBar"></i></div>
    <div class="muted" id="pipeMsg">ожидание</div>
    <h2>Ход</h2>
    <div class="feed" id="pipeFeed"></div>
    <div id="pipeOut"></div>`;

  async function loadReqs() {
    const id = $('pipeDoc').value;
    if (!id) { $('pipeReqs').innerHTML = '<span class="muted">сначала документ</span>'; return; }
    const rows = await j('/requirements?document_id='+id);
    const usable = rows.filter(r => !(r.extra && (r.extra.stub || r.extra.appendix)));
    $('pipeReqs').innerHTML = usable.map(r => `
      <label class="chk">
        <input type="checkbox" class="preq" value="${r.id}" checked />
        <span><span class="code">${esc(r.code)}</span> ${esc((r.text||'').slice(0,140))}</span>
      </label>`).join('') || '<div class="muted">в документе нет требований</div>';
  }
  $('pipeDoc').onchange = loadReqs;
  $('pipeAll').onclick = () => document.querySelectorAll('.preq').forEach(c => c.checked = true);
  $('pipeNone').onclick = () => document.querySelectorAll('.preq').forEach(c => c.checked = false);

  $('pipeGo').onclick = async () => {
    const docId = $('pipeDoc').value;
    if (!docId) { $('pipeMsg').textContent = 'выберите документ'; return; }
    const ids = [...document.querySelectorAll('.preq:checked')].map(c => +c.value);
    if (!ids.length) { $('pipeMsg').textContent = 'отметьте требования'; return; }
    $('pipeGo').disabled = true;
    $('pipeFeed').innerHTML = '';
    $('pipeOut').innerHTML = '';
    $('pipeMsg').textContent = 'запуск…';
    try {
      let res;
      if (scheme) {
        const f = $('pipeFile') && $('pipeFile').files[0];
        if (!f) throw new Error('нужен файл схемы');
        const fd = new FormData();
        fd.append('file', f);
        fd.append('document_id', docId);
        fd.append('requirement_ids', JSON.stringify(ids));
        res = await fetch('/pipelines/runs/schematic-coverage', {method:'POST', body: fd});
      } else {
        res = await fetch('/pipelines/runs/'+name, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({document_id: +docId, requirement_ids: ids}),
        });
      }
      if (!res.ok) throw new Error(await res.text());
      const started = await res.json();
      const stream = await fetch('/pipelines/runs/'+started.run_id+'/stream');
      const reader = stream.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) if (line.trim()) handlePipe(JSON.parse(line));
      }
      if (buf.trim()) handlePipe(JSON.parse(buf));
    } catch (e) {
      $('pipeMsg').textContent = e.message;
    }
    $('pipeGo').disabled = false;
  };

  function handlePipe(ev) {
    const t = ev.tokens_total || {};
    $('tokP').textContent = t.prompt ?? 0;
    $('tokC').textContent = t.completion ?? 0;
    $('tokT').textContent = t.total ?? 0;
    if (ev.total && ev.index) $('pipeBar').style.width = Math.round(100*ev.index/ev.total) + '%';
    if (ev.event === 'done') $('pipeBar').style.width = '100%';
    const el = document.createElement('div');
    el.className = 'ev';
    const tag = ev.event === 'error' ? 'err' : ev.event === 'done' ? 'ok' : 'run';
    const tok = ev.tokens && (ev.tokens.prompt || ev.tokens.completion)
      ? ` · in ${ev.tokens.prompt||0} / out ${ev.tokens.completion||0}` : '';
    el.innerHTML = `<span class="tag ${tag}">${esc(ev.event||'step')}</span> ${esc(ev.step||'')}${tok}`;
    $('pipeFeed').prepend(el);
    $('pipeMsg').textContent = ev.step || ev.event || '';
    if (ev.event === 'done' && ev.result) {
      const r = ev.result;
      let extra = '';
      if (r.download) extra += `<a href="${r.download}">скачать</a> `;
      if (r.files) extra += r.files.map(f => `<a href="${f.download}">${esc(f.requirement)}</a>`).join(' · ');
      if (r.output) extra += `<pre>${esc(String(r.output).slice(0,4000))}</pre>`;
      if (r.result) extra += `<div>${esc(r.result)}</div>`;
      $('pipeOut').innerHTML = extra;
    }
  }
}

function roleOf(name) {
  const n = name.toLowerCase();
  if (n.endsWith('.xlsx') || n.endsWith('.xlsm')) return 'attachment';
  const stem = name.replace(/\.[^.]+$/, '');
  return (stem.split('.').length - 1) >= 2 ? 'attachment' : 'spec';
}

function renderQueue() {
  $('queue').innerHTML = bag.map((f) => `
    <div class="qfile">
      <span class="name">${esc(f.name)}</span>
      <span class="tag ${roleOf(f.name)}">${roleOf(f.name)==='spec'?'спецификация':'вложение'}</span>
    </div>`).join('') || '<div class="muted">список пуст</div>';
  $('indexBtn').disabled = !bag.length;
}

function addFiles(list) {
  for (const f of list) {
    if (![...bag].some(x => x.name===f.name && x.size===f.size)) bag.push(f);
  }
  renderQueue();
  $('msg').textContent = bag.length + ' файл(ов) в пакете';
}

function log(html) {
  const el = $('feed');
  const d = document.createElement('div');
  d.className = 'ev';
  d.innerHTML = html;
  el.prepend(d);
}

function setBar(i, n) {
  $('bar').style.width = (n ? Math.round(100*i/n) : 0) + '%';
}

function mergeReqs(list, isNew) {
  const byId = new Map(reqs.map(r => [r.id, r]));
  for (const r of list) {
    if (!byId.has(r.id)) {
      if (isNew) seen.add(r.id);
      reqs.unshift(r);
      byId.set(r.id, r);
    }
  }
  renderReqs();
}

function renderStats(t) {
  $('stats').innerHTML = `
    <div><b>${t.documents??0}</b><span class="muted">док.</span></div>
    <div><b>${t.requirements??0}</b><span class="muted">треб.</span></div>
    <div><b>${t.products??0}</b><span class="muted">изделия</span></div>
    <div><b>${t.attachments??0}</b><span class="muted">влож.</span></div>`;
}

function renderReqs() {
  const q = $('q').value.toLowerCase();
  const rows = reqs.filter(r => !q || (r.code+' '+(r.text||'')).toLowerCase().includes(q));
  $('reqs').innerHTML = rows.map(r => {
    const stub = r.extra && r.extra.stub || r.stub;
    return `<div class="item ${seen.has(r.id)?'new':''}" onclick="openReq(${r.id})">
      <div class="code">${esc(r.code)}
        ${stub?'<span class="tag stub">stub</span>':''}
        ${r.revision?'<span class="tag">rev '+esc(r.revision)+'</span>':''}
        ${r.kind?'<span class="tag">'+esc(r.kind)+'</span>':''}
      </div>
      <div>${esc((r.text||'').slice(0,160))}</div>
    </div>`;
  }).join('') || '<div class="muted">ещё нет требований — проиндексируйте пакет</div>';
}

async function openReq(id) {
  const r = await j('/requirements/'+id);
  const attrs = Object.entries(r.attributes||{}).map(([k,v]) =>
    `<tr><th>${esc(k)}</th><td>${esc(String(v).slice(0,4000))}</td></tr>`).join('');
  const parents = (r.parents||[]).map(p =>
    `<div class="rel">↑ ${p.stub?'<span class="tag stub">не загружено</span>':''}<span class="code">${esc(p.code)}</span> ${esc((p.text||'').slice(0,160))}</div>`).join('');
  const atts = (r.attachments||[]).map(a =>
    `<div class="rel">📎 ${esc(a.filename)} <pre>${esc((a.text_content||'').slice(0,2000))}</pre></div>`).join('');
  $('card').innerHTML = `
    <div class="code"><a href="#/requirements/${r.id}" style="color:inherit">${esc(r.code)}</a></div>
    <div class="muted">${esc(r.kind||'')} · rev ${esc(r.revision||'—')}</div>
    ${r.document_id?`<div class="rel"><a href="#/documents/${r.document_id}">документ</a></div>`:''}
    <pre>${esc(r.text||'')}</pre>
    <h2>Вышестоящие</h2>${parents || '<div class="muted">нет</div>'}
    <h2>Атрибуты и файлы</h2><table>${attrs}</table>${atts}`;
}

async function loadDocs() {
  docs = await j('/documents');
  $('docs').innerHTML = docs.map(d => `
    <div class="item ${currentDoc===d.id?'on':''}" onclick="selectDoc(${d.id})">
      <div><a href="#/documents/${d.id}" onclick="event.stopPropagation()">${esc(d.title || d.filename)}</a></div>
      <div class="muted">${esc(d.filename)} · ${esc(d.status)}</div>
    </div>`).join('') || '<div class="muted">нет документов</div>';
}

async function selectDoc(id) {
  currentDoc = id;
  const qs = id ? ('?document_id='+id) : '';
  const r = await j('/requirements'+qs);
  reqs = r;
  const ov = await j('/overview');
  renderStats(ov.totals);
  renderReqs();
  loadDocs();
}

$('drop').addEventListener('click', e => { if (e.target.id!=='files') $('files').click(); });
$('files').addEventListener('change', e => addFiles(e.target.files));
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', e => {
  e.preventDefault(); $('drop').classList.remove('over');
  addFiles(e.dataTransfer.files);
});
$('clearBtn').onclick = () => { bag = []; renderQueue(); $('msg').textContent = 'список очищен'; };
$('q').addEventListener('input', renderReqs);

$('wipeBtn').onclick = async () => {
  if (!confirm('Удалить все изделия, требования и документы из БД?')) return;
  try {
    await j('/db/wipe', { method: 'POST' });
    reqs = []; docs = []; currentDoc = null; seen.clear();
    renderReqs(); renderStats({}); loadDocs();
    $('card').innerHTML = '<span class="muted">база пуста</span>';
    $('msg').textContent = 'БД очищена';
    log('<span class="tag ok">wipe</span> база очищена');
    if (location.hash && location.hash !== '#/') location.hash = '#/';
    else route();
  } catch (e) {
    $('msg').textContent = e.message;
  }
};

$('indexBtn').onclick = async () => {
  if (!bag.length) return;
  $('indexBtn').disabled = true;
  $('msg').textContent = 'индексация…';
  $('feed').innerHTML = '';
  const fd = new FormData();
  for (const f of bag) fd.append('files', f);
  try {
    const res = await fetch('/index', { method: 'POST', body: fd });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        handle(JSON.parse(line));
      }
    }
    if (buf.trim()) handle(JSON.parse(buf));
    bag = [];
    renderQueue();
    await loadDocs();
  } catch (e) {
    $('msg').textContent = e.message;
    log('<span class="tag err">ошибка</span> '+esc(e.message));
  }
  $('indexBtn').disabled = false;
};

function handle(ev) {
  if (ev.event === 'queued') {
    log('<span class="tag">пакет</span> '+ev.files.map(f => f.filename).join(', '));
    if (ev.totals) renderStats(ev.totals);
  }
  if (ev.event === 'file_start') {
    setBar(ev.index-1, ev.total);
    $('msg').textContent = ev.filename + ' — ' + ev.step;
    log('<span class="tag run">'+ev.index+'/'+ev.total+'</span> <b>'+esc(ev.filename)+'</b> · '+esc(ev.step));
  }
  if (ev.event === 'file_done') {
    setBar(ev.index, ev.total);
    const c = ev.entities.counts || {};
    log('<span class="tag ok">готово</span> <b>'+esc(ev.filename)+'</b> → треб. '+c.requirements+', изд. '+c.products+', влож. '+c.attachments+(c.stubs? ', stub '+c.stubs:''));
    mergeReqs(ev.entities.requirements || [], true);
    currentDoc = ev.document_id;
  }
  if (ev.event === 'file_error') {
    log('<span class="tag err">сбой</span> <b>'+esc(ev.filename)+'</b> — '+esc(ev.error));
  }
  if (ev.event === 'linking') {
    $('msg').textContent = ev.step;
    log('<span class="tag run">связи</span> '+esc(ev.step));
  }
  if (ev.event === 'done') {
    setBar(1,1);
    $('msg').textContent = 'готово: '+ (ev.documents||[]).length + ' док.';
    if (ev.totals) renderStats(ev.totals);
    log('<span class="tag ok">пакет закрыт</span> в базе треб. '+(ev.totals&&ev.totals.requirements));
    if (ev.documents && ev.documents[0]) currentDoc = ev.documents[0].id;
  }
}

$('matrix').onclick = async () => {
  $('msg').textContent = 'матрица…';
  try {
    const res = await j('/pipelines/review-correctness', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({document_id: currentDoc}),
    });
    $('msg').innerHTML = (res.result||'готово')+' · <a href="'+(res.download||'#')+'" style="color:#3d9cf0">скачать</a>';
  } catch(e) { $('msg').textContent = e.message; }
};
$('scheme').onclick = () => $('schemeFile').click();
$('schemeFile').onchange = async () => {
  const f = $('schemeFile').files[0];
  if (!f) return;
  $('msg').textContent = 'разбор схемы…';
  const fd = new FormData();
  fd.append('file', f);
  if (currentDoc) fd.append('document_id', currentDoc);
  try {
    const res = await fetch('/pipelines/schematic-coverage', {method:'POST', body: fd});
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const cov = data.coverage || {};
    const miss = (cov.missing||[]).map(m => m.name || m.node_id).join(', ') || 'нет';
    $('msg').innerHTML = 'покрытие '+ (cov.coverage??0) +'% · не покрыто: '+esc(miss)+
      ' · <a href="'+(data.download||'#')+'" style="color:#3d9cf0">отчёт</a>';
  } catch(e) { $('msg').textContent = e.message; }
  $('schemeFile').value = '';
};
$('unittests').onclick = async () => {
  $('msg').textContent = 'тесты…';
  try {
    const res = await j('/pipelines/unit-tests', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({document_id: currentDoc}),
    });
    const links = (res.files||[]).map(f => '<a href="'+f.download+'" style="color:#3d9cf0">'+esc(f.requirement)+'</a>').join(' · ');
    $('msg').innerHTML = (res.count||0)+' xlsx<br>'+links;
  } catch(e) { $('msg').textContent = e.message; }
};

window.addEventListener('hashchange', route);
j('/overview').then(ov => {
  renderStats(ov.totals);
  reqs = ov.recent_requirements || [];
  renderReqs();
}).catch(()=>{});
loadDocs();
renderQueue();
route();
</script>
</body>
</html>
